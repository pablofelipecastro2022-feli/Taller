<style>
:root{--bg:#F1F4F2;--tinta:#1B1F23;--acero:#5A6770;--acc:#2BB673;--ok:#1E8E58;--rojo:#C62828;--card:#fff;--borde:#D3DAD6}
@media(prefers-color-scheme:dark){:root{--bg:#14181B;--tinta:#E9EEEB;--acero:#9AA8A1;--card:#1E2428;--borde:#2F3A40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.4 system-ui,Arial,sans-serif;padding-bottom:80px}
header{background:#1B1F23;color:#fff;padding:12px 16px;border-bottom:4px solid var(--acc);display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px}
header small{color:#B9C6C0;font-size:12px}
header .lg{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.prev{max-width:160px;max-height:120px;background:#fff;border-radius:8px;padding:4px}
main{padding:12px;max-width:640px;margin:0 auto}
h2{font-size:18px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:10px}
.card.atr{border-left:5px solid var(--rojo)}
.card p{margin:6px 0}
.tag{background:var(--rojo);color:#fff;border-radius:6px;padding:1px 6px;font-size:13px}
.vacio{color:var(--acero)}
label{display:block;margin:8px 0;font-size:14px;color:var(--acero)}
input,select{width:100%;padding:10px;margin-top:4px;font-size:16px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--tinta)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{position:relative;margin:0}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.chip span{display:block;padding:10px 12px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--tinta);font-size:15px;font-weight:600}
.chip input:checked+span{background:var(--acc);border-color:var(--acc);color:#0E1A14}
.chip input:focus-visible+span{outline:2px solid var(--tinta)}
.row,.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>label{flex:1}
.col{display:flex;flex-direction:column;gap:6px}
button{background:var(--tinta);color:var(--bg);border:0;border-radius:8px;padding:11px 14px;font-size:15px;font-weight:600;margin-top:6px}
button.sec{background:var(--ok);color:#fff}
button.del{background:transparent;color:var(--rojo);border:1px solid var(--rojo)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1B1F23}
nav button{flex:1;border-radius:0;background:transparent;color:#C4D0CA;margin:0;padding:14px 2px;font-size:14px;position:relative}
nav button.on{color:#0E1A14;background:var(--acc)}
#nAv{background:var(--rojo);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;margin-left:4px}
#nAv:empty{display:none}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:12px;width:92%;max-width:480px;background:var(--card);color:var(--tinta)}
details{margin-bottom:10px}
summary{font-weight:600;padding:6px 0}
</style>

<script>
/* ---------- PDF mínimo (sin librerías, funciona sin internet) ---------- */
const L1=s=>String(s==null?'':s).replace(/[–—]/g,'-').replace(/[•·✔✓]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'?');
const pesc=s=>L1(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
const lat=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
function mW(t,sz,b){
  try{
    if(!mW.c)mW.c=document.createElement('canvas').getContext('2d');
    mW.c.font=(b?'bold ':'')+sz+'px Arial,Helvetica,sans-serif';
    const w=mW.c.measureText(L1(t)).width;
    if(w>0||!t)return w;
  }catch(x){}
  return L1(t).length*sz*.52;
}
function PDF(){
  const pages=[[]],imgs=[];let cur=pages[0];
  const col=c=>c.map(v=>(v/255).toFixed(3)).join(' ');
  const n2=v=>(+v).toFixed(2);
  const P={
    W:595.28,H:841.89,
    page(){cur=[];pages.push(cur)},
    fill(x,y,w,h,c){cur.push(col(c)+' rg '+n2(x)+' '+n2(P.H-y-h)+' '+n2(w)+' '+n2(h)+' re f')},
    box(x,y,w,h,c,lw){cur.push(col(c)+' RG '+lw+' w '+n2(x)+' '+n2(P.H-y-h)+' '+n2(w)+' '+n2(h)+' re S')},
    line(x1,y1,x2,y2,c,lw){cur.push(col(c)+' RG '+lw+' w '+n2(x1)+' '+n2(P.H-y1)+' m '+n2(x2)+' '+n2(P.H-y2)+' l S')},
    text(x,y,t,sz,b,c){cur.push('BT '+col(c)+' rg /'+(b?'F2':'F1')+' '+sz+' Tf '+n2(x)+' '+n2(P.H-y)+' Td ('+pesc(t)+') Tj ET')},
    textR(xr,y,t,sz,b,c){P.text(xr-mW(t,sz,b),y,t,sz,b,c)},
    img(i,x,y,w,h){cur.push('q '+n2(w)+' 0 0 '+n2(h)+' '+n2(x)+' '+n2(P.H-y-h)+' cm /Im'+i+' Do Q')},
    addImg(dataUrl,w,h){
      const bin=atob(dataUrl.split(',')[1]);const u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      imgs.push({b:u,w:w,h:h});return imgs.length-1;
    },
    wrap(t,maxW,sz,b){
      const out=[];
      String(t==null?'':t).split('\n').forEach(par=>{
        let line='';
        par.split(/\s+/).filter(Boolean).forEach(w=>{
          const test=line?line+' '+w:w;
          if(mW(test,sz,b)<=maxW||!line)line=test;else{out.push(line);line=w}
        });
        out.push(line);
      });
      return out;
    },
    build(){
      const parts=[],xr=[];let off=0;
      const push=u=>{parts.push(u);off+=u.length};
      const nI=imgs.length,total=4+nI+pages.length*2;
      push(lat('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
      const obj=(n,body)=>{xr[n]=off;push(lat(n+' 0 obj\n'+body+'\nendobj\n'))};
      const kids=pages.map((_,k)=>(5+nI+k*2+1)+' 0 R').join(' ');
      obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
      obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>');
      obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      imgs.forEach((im,i)=>{
        const n=5+i;xr[n]=off;
        push(lat(n+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.b.length+' >>\nstream\n'));
        push(im.b);push(lat('\nendstream\nendobj\n'));
      });
      const xo=imgs.map((_,i)=>'/Im'+i+' '+(5+i)+' 0 R').join(' ');
      const res='<< /Font << /F1 3 0 R /F2 4 0 R >> /XObject << '+xo+' >> >>';
      pages.forEach((ops,k)=>{
        const cn=5+nI+k*2,pn=cn+1;
        const data=lat(ops.join('\n'));
        xr[cn]=off;
        push(lat(cn+' 0 obj\n<< /Length '+data.length+' >>\nstream\n'));push(data);push(lat('\nendstream\nendobj\n'));
        obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+n2(P.W)+' '+n2(P.H)+'] /Resources '+res+' /Contents '+cn+' 0 R >>');
      });
      const xs=off;
      let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
      for(let i=1;i<=total;i++)x+=String(xr[i]).padStart(10,'0')+' 00000 n \n';
      x+='trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xs+'\n%%EOF';
      push(lat(x));
      const res2=new Uint8Array(off);let p=0;parts.forEach(u=>{res2.set(u,p);p+=u.length});
      return res2;
    }
  };
  return P;
}

const corto=t=>t.replace(/^Cambio de /,'');
const cli=id=>D.clientes.find(c=>c.id===id)||{nombre:'(cliente borrado)',tel:'',auto:'',patente:'',kmMes:1000};
const ordenT=(a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''));
const tNom=()=>(D.taller.nombre||'').trim();
const deT=()=>tNom()?'de '+tNom():'del taller';
const enT=()=>tNom()?'en '+tNom():'en el taller';
const GOTA='<svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path d="M32 5 C32 5 14 28 14 40 a18 18 0 0 0 36 0 C50 28 32 5 32 5Z" fill="#2BB673"/><path d="M22 41 a10 10 0 0 0 6 9" fill="none" stroke="#BEF5D7" stroke-width="3" stroke-linecap="round"/></svg>';

function wa(tel,msg){
  let n=String(tel||'').replace(/\D/g,'');
  if(n&&!n.startsWith('54'))n='549'+n.replace(/^0+/,'');
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');
}
function hdr(){
  const t=D.taller;
  $('#hd').innerHTML=(t.logo?`<img class="lg" src="${t.logo.d}" alt="">`:GOTA)+`<div><h1>${e(tNom()||'CambioYa')}</h1><small>${tNom()?'CambioYa · ':''}Agenda y avisos de service</small></div>`;
}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=({hoy:vHoy,turnos:vTurnos,clientes:vClientes,avisos:vAvisos,taller:vTaller})[tab]();
  const n=avisosPend().length;
  $('#nAv').textContent=n?n:'';
  hdr();
}

/* ---------- Hoy ---------- */
function cardTurno(s){
  const c=cli(s.cid),at=s.fecha<hoy();
  return `<div class="card ${at?'atr':''}"><b>${fd(s.fecha)} ${e(s.hora||'')} · ${e(c.nombre)}</b>${at?' <span class="tag">Atrasado</span>':''}
  <p>${e(c.auto)} ${e(c.patente)}<br>${e(s.trabajos.join(', '))}</p>
  <div class="row"><button onclick="hecho('${s.id}')">Marcar hecho</button>
  <button class="sec" onclick="waTurno('${s.id}')">Recordar turno al cliente</button>
  <button class="del" onclick="borrar('${s.id}')">Borrar</button></div></div>`;
}
function vHoy(){
  const h=hoy();
  const tt=D.servicios.filter(s=>s.estado==='turno'&&s.fecha<=h).sort(ordenT);
  const av=avisosPend().length;
  return `<h2>Hoy ${fd(h)}</h2>`+
  (tt.length?tt.map(cardTurno).join(''):'<p class="vacio">No hay turnos para hoy. Cargá uno en la pestaña Turnos.</p>')+
  `<div class="card"><b>Avisos de próximo cambio</b><p>${av?av+' cliente(s) con un cambio cerca.':'Ningún cliente con cambios cerca por ahora.'}</p><button onclick="go('avisos')">Ver avisos</button></div>
  <div class="card"><b>Recordatorio para el dueño</b>
  <label>WhatsApp del dueño (con código de área, sin 0 ni 15)<input id="ownTel" inputmode="tel" value="${e(D.dueno||'')}" placeholder="Ej: 2255123456"></label>
  <button onclick="agendaDueno()">Mandarme la agenda de hoy</button></div>`;
}
function agendaDueno(){
  D.dueno=$('#ownTel').value.trim();save();
  const h=hoy(),tt=D.servicios.filter(s=>s.estado==='turno'&&s.fecha<=h).sort(ordenT);
  let m='Agenda '+(tNom()?'de '+tNom():'del taller')+' '+fd(h)+':\n';
  m+=tt.length?tt.map(s=>{const c=cli(s.cid);return '- '+(s.hora||'')+' '+c.nombre+' ('+c.auto+' '+c.patente+'): '+s.trabajos.join(', ')}).join('\n'):'Sin turnos para hoy.';
  m+='\nClientes para avisar: '+avisosPend().length;
  wa(D.dueno,m);
}

/* ---------- Turnos ---------- */
function vTurnos(){
  if(!D.clientes.length)return '<h2>Turnos</h2><p class="vacio">Primero cargá un cliente en la pestaña Clientes.</p>';
  const ops=D.clientes.map(c=>`<option value="${c.id}">${e(c.nombre)} - ${e(c.patente)}</option>`).join('');
  const chk='<p>Tocá los servicios a realizar:</p><div class="chips">'+TRAB.map(t=>`<label class="chip"><input type="checkbox" name="tr" value="${t}"><span>${t}</span></label>`).join('')+'</div><label>Otro trabajo (opcional)<input id="to" placeholder="Escribilo acá"></label>';
  const lista=D.servicios.filter(s=>s.estado==='turno').sort(ordenT);
  return `<h2>Nuevo turno</h2><div class="card"><label>Cliente<select id="tc">${ops}</select></label>
  <div class="row2"><label>Día<input type="date" id="tf" value="${hoy()}"></label><label>Hora<input type="time" id="th" value="09:00"></label></div>
  ${chk}<button onclick="addTurno()">Guardar turno</button></div>
  <h2>Turnos pendientes</h2>`+(lista.length?lista.map(cardTurno).join(''):'<p class="vacio">No hay turnos pendientes.</p>');
}
function addTurno(){
  const tr=[...document.querySelectorAll('input[name=tr]:checked')].map(i=>i.value);
  const ot=$('#to').value.trim();
  if(ot)tr.push(ot);
  if(!tr.length){alert('Marcá al menos un servicio.');return}
  if(!$('#tf').value){alert('Elegí el día.');return}
  D.servicios.push({id:uid(),cid:$('#tc').value,estado:'turno',fecha:$('#tf').value,hora:$('#th').value,trabajos:tr});
  save();render();
}
function waTurno(id){
  const s=D.servicios.find(x=>x.id===id),c=cli(s.cid);
  wa(c.tel,`Hola ${c.nombre}, te recordamos tu turno ${enT()} el ${fd(s.fecha)} a las ${s.hora||''} para: ${s.trabajos.join(', ')}. ¡Te esperamos!`);
}
function borrar(id){
  if(!confirm('¿Borrar este turno?'))return;
  D.servicios=D.servicios.filter(s=>s.id!==id);save();render();
}

/* ---------- Trabajo hecho + resumen al cliente ---------- */
function elig(s){return s.trabajos.filter(t=>t in D.interv)}
function hecho(id){
  cur=id;
  const ik=elig(D.servicios.find(x=>x.id===id)).map((t,i)=>`<label>${e(corto(t))}: próximo cambio dentro de (km). Poné 0 si no lleva aviso<input id="ik${i}" type="number" inputmode="numeric" value="${D.interv[t]||0}"></label>`).join('');
  $('#dlg').innerHTML=`<h2>Trabajo hecho</h2>
  <label>Kilometraje actual del auto<input id="hk" type="number" inputmode="numeric" placeholder="Ej: 85000"></label>
  <label>Aceite usado (tipo y litros)<input id="ha" placeholder="Ej: 10W40 sintético, 4 L"></label>
  <label>Costo total $<input id="hc" type="number" inputmode="numeric"></label>
  <h2>Cada cuántos km se vuelve a cambiar</h2>
  <p class="vacio">Ajustalo según el motor de este auto (la correa de distribución puede ir de 60.000 a 160.000 km).</p>${ik}
  <div class="row"><button onclick="guardarHecho()">Guardar</button><button class="del" onclick="$('#dlg').close()">Cancelar</button></div>`;
  $('#dlg').showModal();
}
function guardarHecho(){
  const km=parseInt($('#hk').value);
  if(!km){alert('Poné el kilometraje actual.');return}
  const s=D.servicios.find(x=>x.id===cur),prox={};
  elig(s).forEach((t,i)=>{const v=parseInt($('#ik'+i).value)||0;if(v)prox[t]=km+v});
  Object.assign(s,{estado:'hecho',fechaHecho:hoy(),km,aceite:$('#ha').value,costo:$('#hc').value,prox,avisados:{}});
  save();$('#dlg').close();render();
  listo(s.id);
}
function listo(id){
  $('#dlg').innerHTML=`<h2>Servicio guardado</h2><p>¿Cómo se lo mandás al cliente?</p>
  <div class="col"><button class="sec" onclick="reenv('${id}')">Resumen por WhatsApp</button>
  <button onclick="pdfServicio('${id}')">PDF de servicio realizado</button>
  <button class="del" onclick="$('#dlg').close()">Cerrar</button></div>`;
  $('#dlg').showModal();
}
function msgHecho(s){
  const c=cli(s.cid);
  const lis=s.trabajos.map(t=>'- '+t+(s.prox&&s.prox[t]?' (próximo: a los '+nk(s.prox[t])+' km)':'')).join('\n');
  return `Hola ${c.nombre}, te escribimos ${deT()}. En tu ${c.auto} (${c.patente}), a los ${nk(s.km)} km, se hizo:\n${lis}\nCuando se acerque el próximo cambio te vamos a avisar. ¡Gracias por confiar en ${tNom()||'nosotros'}!`;
}
function reenv(id){const s=D.servicios.find(x=>x.id===id);wa(cli(s.cid).tel,msgHecho(s))}

/* ---------- PDF de servicio realizado ---------- */
function armarPDF(s){
  const c=cli(s.cid),t=D.taller,p=PDF();
  const INK=[27,31,35],GR=[43,182,115],GRD=[30,142,88],GRIS=[100,112,120],ROJO=[198,40,40],ROJOF=[253,236,234];
  const M=40,R=p.W-M;
  p.fill(0,0,p.W,96,INK);p.fill(0,96,p.W,4,GR);
  let tx=M;
  if(t.logo&&t.logo.d){
    const i=p.addImg(t.logo.d,t.logo.w,t.logo.h),k=Math.min(64/t.logo.w,64/t.logo.h),w=t.logo.w*k,h=t.logo.h*k;
    p.fill(M,16,72,72,[255,255,255]);p.img(i,M+(72-w)/2,16+(72-h)/2,w,h);tx=M+88;
  }
  p.text(tx,48,tNom()||'Taller mecánico',22,true,[255,255,255]);
  const sub=[t.dir,t.tel?'Tel: '+t.tel:''].filter(Boolean).join('  -  ');
  if(sub)p.text(tx,68,sub,10.5,false,[200,210,206]);
  let y=136;
  p.text(M,y,'SERVICIO REALIZADO',24,true,INK);
  p.textR(R,y,'Fecha: '+fd(s.fechaHecho),12,false,GRIS);
  y+=18;p.line(M,y,R,y,[210,218,214],1);y+=24;
  const col2=M+(R-M)/2+10;
  const dato=(x,yy,lab,val)=>{p.text(x,yy,lab,9.5,false,GRIS);p.text(x,yy+15,val||'-',13,true,INK)};
  dato(M,y,'CLIENTE',c.nombre);dato(col2,y,'VEHÍCULO',c.auto);y+=44;
  dato(M,y,'PATENTE',c.patente);dato(col2,y,'KILOMETRAJE',nk(s.km)+' km');y+=44;
  if(s.aceite||s.costo){
    dato(M,y,'ACEITE USADO',s.aceite||'-');
    if(s.costo)dato(col2,y,'COSTO TOTAL','$ '+nk(s.costo));
    y+=44;
  }
  y+=4;p.text(M,y,'Trabajos realizados',15,true,GRD);y+=10;
  s.trabajos.forEach(tr=>{
    const ls=p.wrap(tr,R-M-24,12.5,false);
    ls.forEach((l,i)=>{
      y+=20;
      if(y>760){p.page();y=60}
      if(i===0)p.fill(M+2,y-9,8,8,GR);
      p.text(M+22,y,l,12.5,false,INK);
    });
  });
  const pr=Object.keys(s.prox||{});
  if(pr.length){
    y+=26;
    const lines=pr.map(k=>{const n=corto(k);return n.charAt(0).toUpperCase()+n.slice(1)+': volver a cambiar a los '+nk(s.prox[k])+' km'});
    const bh=79+lines.length*21;
    if(y+bh>790){p.page();y=60}
    p.fill(M,y,R-M,bh,ROJOF);p.box(M,y,R-M,bh,ROJO,2);
    p.text(M+16,y+26,'AVISO - PRÓXIMOS CAMBIOS',14,true,ROJO);
    let yy=y+26;
    lines.forEach(l=>{yy+=21;p.fill(M+18,yy-8,6,6,ROJO);p.text(M+32,yy,l,12,true,INK)});
    yy+=26;
    p.wrap('Te vamos a avisar por WhatsApp cuando se acerque. Si cambia tu uso del auto, avisanos.',R-M-32,10,false).forEach(l=>{p.text(M+16,yy,l,10,false,GRIS);yy+=13});
    y+=bh;
  }
  p.line(M,800,R,800,[210,218,214],1);
  p.text(M,816,'Gracias por confiar en '+(tNom()||'nosotros'),10.5,true,INK);
  p.textR(R,816,'Generado con CambioYa',9.5,false,GRIS);
  return p.build();
}
async function pdfServicio(id){
  const s=D.servicios.find(x=>x.id===id);if(!s)return;
  const c=cli(s.cid);let bytes;
  try{bytes=armarPDF(s)}catch(err){alert('No se pudo armar el PDF: '+err.message);return}
  const blob=new Blob([bytes],{type:'application/pdf'});
  const nom='Servicio-'+((c.patente||c.nombre||'auto').replace(/[^A-Za-z0-9]+/g,''))+'-'+s.fechaHecho+'.pdf';
  const f=new File([blob],nom,{type:'application/pdf'});
  let motivo='sin soporte';
  try{
    await navigator.share({files:[f],title:'Servicio realizado'});
    return;
  }catch(err){
    if(err&&err.name==='AbortError')return;
    motivo=(err&&err.name)||motivo;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),20000);
  alert('Este aparato no abrió el menú de compartir ('+motivo+'). El PDF se guardó en Descargas: adjuntalo en el WhatsApp del cliente.');
}

/* ---------- Avisos de próximo cambio ---------- */
function estKm(s,c){
  const dias=Math.max(0,(new Date(hoy())-new Date(s.fechaHecho))/864e5);
  return (Number(s.km)||0)+Math.round(dias/30*(c.kmMes||1000));
}
function avisosPend(){
  const g=[];
  D.servicios.filter(s=>s.estado==='hecho'&&s.prox).forEach(s=>{
    const c=cli(s.cid),est=estKm(s,c),it=[];
    Object.keys(s.prox).forEach(t=>{
      if((s.avisados||{})[t])return;
      if(D.servicios.some(x=>x.cid===s.cid&&x.estado==='hecho'&&x.fechaHecho>s.fechaHecho&&x.trabajos.includes(t)))return;
      const falta=s.prox[t]-est;
      if(falta<=D.margen)it.push({t,falta,km:s.prox[t]});
    });
    if(it.length)g.push({s,c,it,est});
  });
  return g.sort((a,b)=>Math.min(...a.it.map(i=>i.falta))-Math.min(...b.it.map(i=>i.falta)));
}
function txtFalta(i){return i.falta>0?'faltan aprox. '+nk(i.falta)+' km':'ya te toca el cambio'}
function vAvisos(){
  const l=avisosPend();
  return '<h2>Clientes para avisar</h2><p class="vacio">Se calcula con los km del último servicio y los km por mes de cada cliente.</p>'+(l.length?l.map(g=>`<div class="card"><b>${e(g.c.nombre)}</b> · ${e(g.c.auto)} ${e(g.c.patente)}
    <p>Último servicio: ${fd(g.s.fechaHecho)} a los ${nk(g.s.km)} km<br>Km estimado hoy: ${nk(g.est)}</p>
    ${g.it.map(i=>`<p>• ${e(corto(i.t))}: ${txtFalta(i)} (se cambia a los ${nk(i.km)} km)</p>`).join('')}
    <div class="row"><button class="sec" onclick="waAviso('${g.s.id}')">Avisar por WhatsApp</button><button class="del" onclick="yaAviso('${g.s.id}')">Ya avisé</button></div></div>`).join(''):'<p class="vacio">Nadie para avisar por ahora.</p>');
}
function marcar(g){g.it.forEach(i=>{g.s.avisados=g.s.avisados||{};g.s.avisados[i.t]=true})}
function waAviso(id){
  const g=avisosPend().find(x=>x.s.id===id);if(!g)return;
  const m=`Hola ${g.c.nombre}, te escribimos ${deT()}. Para tu ${g.c.auto} (${g.c.patente}), según el último servicio a los ${nk(g.s.km)} km:\n`+g.it.map(i=>'- '+corto(i.t)+': '+txtFalta(i)+' (se cambia a los '+nk(i.km)+' km)').join('\n')+'\n¿Querés que te saquemos un turno?';
  wa(g.c.tel,m);marcar(g);save();render();
}
function yaAviso(id){const g=avisosPend().find(x=>x.s.id===id);if(!g)return;marcar(g);save();render()}

/* ---------- Clientes ---------- */
function vClientes(){
  const l=D.clientes.map(c=>{
    const h=D.servicios.filter(s=>s.cid===c.id&&s.estado==='hecho').sort((a,b)=>b.fechaHecho.localeCompare(a.fechaHecho));
    return `<details class="card"><summary>${e(c.nombre)} · ${e(c.patente)}</summary>
    <p>${e(c.auto)}<br>Tel: ${e(c.tel)}</p>
    <label>Km que hace por mes (aprox.)<input type="number" inputmode="numeric" value="${c.kmMes||1000}" onchange="setKmMes('${c.id}',this.value)"></label>
    ${h.length?h.map(s=>`<p>• ${fd(s.fechaHecho)} · ${nk(s.km||0)} km<br>${e(s.trabajos.join(', '))}${s.aceite?' · '+e(s.aceite):''}${s.costo?' · $'+e(s.costo):''}<br><span class="row"><button class="sec" onclick="reenv('${s.id}')">Resumen WhatsApp</button><button onclick="pdfServicio('${s.id}')">PDF</button></span></p>`).join(''):'<p class="vacio">Sin servicios hechos todavía.</p>'}
    <button class="del" onclick="delCli('${c.id}')">Borrar cliente</button></details>`}).join('');
  const ints=TRAB.map((t,i)=>`<label>${t} (km)<input type="number" inputmode="numeric" value="${D.interv[t]}" onchange="setInt(${i},this.value)"></label>`).join('');
  return `<h2>Nuevo cliente</h2><div class="card">
  <label>Nombre<input id="cn"></label>
  <label>WhatsApp (con código de área, sin 0 ni 15)<input id="ct" inputmode="tel" placeholder="Ej: 2255123456"></label>
  <label>Auto (marca y modelo)<input id="ca"></label>
  <label>Patente<input id="cp" autocapitalize="characters"></label>
  <label>Km que hace por mes (aprox.)<input id="ck" type="number" inputmode="numeric" value="1000"></label>
  <button onclick="addCli()">Guardar cliente</button></div>
  <h2>Clientes (${D.clientes.length})</h2>${l||'<p class="vacio">Todavía no cargaste clientes.</p>'}
  <h2>Cada cuántos km se cambia</h2><details class="card"><summary>Ver y cambiar los km de cada servicio</summary>
  <p class="vacio">Poné 0 si ese servicio no lleva aviso.</p>${ints}
  <label>Avisar al cliente cuando falten (km)<input type="number" inputmode="numeric" value="${D.margen}" onchange="setMargen(this.value)"></label>
  <button class="sec" onclick="resetInt()">Volver a los km recomendados</button></details>
  <h2>Copia de seguridad</h2><div class="card"><p>Los datos quedan guardados solo en este aparato. Hacé una copia seguido.</p>
  <div class="row"><button onclick="copiar()">Copiar copia</button><button class="sec" onclick="restaurar()">Restaurar copia</button></div></div>`;
}
function setInt(i,v){D.interv[TRAB[i]]=parseInt(v)||0;save()}
function resetInt(){if(!confirm('Esto vuelve todos los km a los valores recomendados (aceite y filtros 10.000, correas 80.000). ¿Seguir?'))return;D.interv=Object.assign({},INT0);save();render()}
function setKmMes(id,v){const c=D.clientes.find(x=>x.id===id);if(c){c.kmMes=parseInt(v)||1000;save()}}
function setMargen(v){D.margen=parseInt(v)||1000;save()}
function addCli(){
  const n=$('#cn').value.trim();
  if(!n){alert('Poné el nombre del cliente.');return}
  D.clientes.push({id:uid(),nombre:n,tel:$('#ct').value.trim(),auto:$('#ca').value.trim(),patente:$('#cp').value.trim().toUpperCase(),kmMes:parseInt($('#ck').value)||1000});
  save();render();
}
function delCli(id){
  if(!confirm('¿Borrar este cliente y todo su historial?'))return;
  D.clientes=D.clientes.filter(c=>c.id!==id);
  D.servicios=D.servicios.filter(s=>s.cid!==id);
  save();render();
}
function copiar(){
  const t=JSON.stringify(D);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Copia lista. Pegala en un chat de WhatsApp para guardarla.'),()=>prompt('Copiá este texto:',t));
  else prompt('Copiá este texto:',t);
}
function restaurar(){
  const t=prompt('Pegá la copia de seguridad:');
  if(!t)return;
  try{
    const x=JSON.parse(t);
    if(!Array.isArray(x.clientes)||!Array.isArray(x.servicios))throw 0;
    if(!confirm('Esto reemplaza los datos de este aparato. ¿Seguir?'))return;
    D=x;fix();save();render();
  }catch(err){alert('Ese texto no es una copia válida.')}
}

/* ---------- Mi taller (nombre y logo) ---------- */
function vTaller(){
  const t=D.taller;
  return `<h2>Mi taller</h2><div class="card"><p class="vacio">Estos datos salen en los mensajes y en el PDF que le mandás al cliente.</p>
  <label>Nombre del taller<input value="${e(t.nombre)}" oninput="setT('nombre',this.value)" placeholder="Ej: Taller Los Pinos"></label>
  <label>Teléfono (opcional)<input inputmode="tel" value="${e(t.tel)}" oninput="setT('tel',this.value)" placeholder="Ej: 2255 123456"></label>
  <label>Dirección (opcional)<input value="${e(t.dir)}" oninput="setT('dir',this.value)" placeholder="Ej: Av. San Martín 450"></label></div>
  <h2>Logo</h2><div class="card">
  ${t.logo?`<p><img class="prev" src="${t.logo.d}" alt="Logo"></p>`:'<p class="vacio">Todavía no cargaste el logo. Mientras tanto se usa la gota de CambioYa.</p>'}
  <label>Elegí la imagen del logo<input type="file" accept="image/*" onchange="subirLogo(this)"></label>
  ${t.logo?'<button class="del" onclick="quitarLogo()">Quitar logo</button>':''}</div>`;
}
function setT(k,v){D.taller[k]=v;save();hdr()}
function subirLogo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,400/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      D.taller.logo={d:cv.toDataURL('image/jpeg',0.85),w:w,h:h};
      save();render();
    };
    im.onerror=()=>alert('No pude leer esa imagen. Probá con otra (JPG o PNG).');
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function quitarLogo(){D.taller.logo=null;save();render()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
