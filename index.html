<style>
:root{--bg:#EEF1F2;--tinta:#14232B;--acero:#3C5766;--aceite:#E8A317;--ok:#2E7D4F;--rojo:#B3402F;--card:#fff;--borde:#CBD5DA}
@media(prefers-color-scheme:dark){:root{--bg:#10191E;--tinta:#E8EEF0;--acero:#9DB4C0;--card:#1B2A32;--borde:#33474F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.4 system-ui,Arial,sans-serif;padding-bottom:80px}
header{background:#14232B;color:#fff;padding:14px 16px;border-bottom:4px solid var(--aceite)}
header h1{margin:0;font-size:20px}
main{padding:12px;max-width:640px;margin:0 auto}
h2{font-size:18px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:10px}
.card.atr{border-left:5px solid var(--rojo)}
.card p{margin:6px 0}
.tag{background:var(--rojo);color:#fff;border-radius:6px;padding:1px 6px;font-size:13px}
.vacio{color:var(--acero)}
label{display:block;margin:8px 0;font-size:14px;color:var(--acero)}
input,select{width:100%;padding:10px;margin-top:4px;font-size:16px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--tinta)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{position:relative;margin:0}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.chip span{display:block;padding:10px 12px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--tinta);font-size:15px;font-weight:600}
.chip input:checked+span{background:var(--aceite);border-color:var(--aceite);color:#14232B}
.chip input:focus-visible+span{outline:2px solid var(--tinta)}
.row,.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>label{flex:1}
button{background:var(--tinta);color:var(--bg);border:0;border-radius:8px;padding:11px 14px;font-size:15px;font-weight:600;margin-top:6px}
button.sec{background:var(--ok);color:#fff}
button.del{background:transparent;color:var(--rojo);border:1px solid var(--rojo)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14232B}
nav button{flex:1;border-radius:0;background:transparent;color:#C9D6DC;margin:0;padding:14px 4px;position:relative}
nav button.on{color:#14232B;background:var(--aceite)}
#nAv{background:var(--rojo);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;margin-left:4px}
#nAv:empty{display:none}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:12px;width:92%;max-width:480px;background:var(--card);color:var(--tinta)}
details{margin-bottom:10px}
summary{font-weight:600;padding:6px 0}
</style>
</head>
<body>
<header><h1>Taller · Agenda y avisos</h1></header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<nav>
<button data-t="hoy" onclick="go(this.dataset.t)">Hoy</button>
<button data-t="turnos" onclick="go(this.dataset.t)">Turnos</button>
<button data-t="clientes" onclick="go(this.dataset.t)">Clientes</button>
<button data-t="avisos" onclick="go(this.dataset.t)">Avisos<span id="nAv"></span></button>
</nav>
<script>
const K='tallerApp1';
const INT0={'Cambio de aceite':10000,'Cambio de filtro de aceite':10000,'Cambio de filtro de aire':10000,'Cambio de filtro de nafta':10000,'Cambio de filtro de habitáculo':10000,'Cambio de correa de distribución':80000,'Cambio de correa auxiliar':80000,'Cambio de cadena de distribución':0,'Cambio de bujías':30000,'Cambio de líquido refrigerante':40000,'Cambio de líquido de frenos':40000,'Cambio de pastillas de freno':30000,'Cambio de aceite de caja':60000,'Cambio de batería':0,'Cambio de escobillas':0,'Cambio de lámparas':0};
const TRAB=Object.keys(INT0);
let D=null;
try{D=JSON.parse(localStorage.getItem(K))}catch(x){}
D=D||{clientes:[],servicios:[]};
function fix(){D.clientes=D.clientes||[];D.servicios=D.servicios||[];D.interv=Object.assign({},INT0,D.interv||{});D.margen=D.margen||1000;D.dueno=D.dueno||''}
fix();
let tab='hoy',cur=null;
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=f=>f?f.split('-').reverse().join('/'):'';
const nk=n=>Number(n).toLocaleString('es-AR');
const corto=t=>t.replace(/^Cambio de /,'');
const cli=id=>D.clientes.find(c=>c.id===id)||{nombre:'(cliente borrado)',tel:'',auto:'',patente:'',kmMes:1000};
const ordenT=(a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''));

function wa(tel,msg){
  let n=String(tel||'').replace(/\D/g,'');
  if(n&&!n.startsWith('54'))n='549'+n.replace(/^0+/,'');
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');
}
function go(t){tab=t;render()}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=({hoy:vHoy,turnos:vTurnos,clientes:vClientes,avisos:vAvisos})[tab]();
  const n=avisosPend().length;
  $('#nAv').textContent=n?n:'';
}

/* ---------- Hoy ---------- */
function cardTurno(s){
  const c=cli(s.cid),at=s.fecha<hoy();
  return `<div class="card ${at?'atr':''}"><b>${fd(s.fecha)} ${e(s.hora||'')} · ${e(c.nombre)}</b>${at?' <span class="tag">Atrasado</span>':''}
  <p>${e(c.auto)} ${e(c.patente)}<br>${e(s.trabajos.join(', '))}</p>
  <div class="row"><button onclick="hecho('${s.id}')">Marcar hecho</button>
  <button class="sec" onclick="waTurno('${s.id}')">Recordar turno al cliente</button>
  <button class="del" onclick="borrar('${s.id}')">Borrar</button></div></div>`;
}
function vHoy(){
  const h=hoy();
  const tt=D.servicios.filter(s=>s.estado==='turno'&&s.fecha<=h).sort(ordenT);
  const av=avisosPend().length;
  return `<h2>Hoy ${fd(h)}</h2>`+
  (tt.length?tt.map(cardTurno).join(''):'<p class="vacio">No hay turnos para hoy. Cargá uno en la pestaña Turnos.</p>')+
  `<div class="card"><b>Avisos de próximo cambio</b><p>${av?av+' cliente(s) con un cambio cerca.':'Ningún cliente con cambios cerca por ahora.'}</p><button onclick="go('avisos')">Ver avisos</button></div>
  <div class="card"><b>Recordatorio para el dueño</b>
  <label>WhatsApp del dueño (con código de área, sin 0 ni 15)<input id="ownTel" inputmode="tel" value="${e(D.dueno||'')}" placeholder="Ej: 2255123456"></label>
  <button onclick="agendaDueno()">Mandarme la agenda de hoy</button></div>`;
}
function agendaDueno(){
  D.dueno=$('#ownTel').value.trim();save();
  const h=hoy(),tt=D.servicios.filter(s=>s.estado==='turno'&&s.fecha<=h).sort(ordenT);
  let m='Agenda del taller '+fd(h)+':\n';
  m+=tt.length?tt.map(s=>{const c=cli(s.cid);return '- '+(s.hora||'')+' '+c.nombre+' ('+c.auto+' '+c.patente+'): '+s.trabajos.join(', ')}).join('\n'):'Sin turnos para hoy.';
  m+='\nClientes para avisar: '+avisosPend().length;
  wa(D.dueno,m);
}

/* ---------- Turnos ---------- */
function vTurnos(){
  if(!D.clientes.length)return '<h2>Turnos</h2><p class="vacio">Primero cargá un cliente en la pestaña Clientes.</p>';
  const ops=D.clientes.map(c=>`<option value="${c.id}">${e(c.nombre)} - ${e(c.patente)}</option>`).join('');
  const chk='<p>Tocá los servicios a realizar:</p><div class="chips">'+TRAB.map(t=>`<label class="chip"><input type="checkbox" name="tr" value="${t}"><span>${t}</span></label>`).join('')+'</div><label>Otro trabajo (opcional)<input id="to" placeholder="Escribilo acá"></label>';
  const lista=D.servicios.filter(s=>s.estado==='turno').sort(ordenT);
  return `<h2>Nuevo turno</h2><div class="card"><label>Cliente<select id="tc">${ops}</select></label>
  <div class="row2"><label>Día<input type="date" id="tf" value="${hoy()}"></label><label>Hora<input type="time" id="th" value="09:00"></label></div>
  ${chk}<button onclick="addTurno()">Guardar turno</button></div>
  <h2>Turnos pendientes</h2>`+(lista.length?lista.map(cardTurno).join(''):'<p class="vacio">No hay turnos pendientes.</p>');
}
function addTurno(){
  const tr=[...document.querySelectorAll('input[name=tr]:checked')].map(i=>i.value);
  const ot=$('#to').value.trim();
  if(ot)tr.push(ot);
  if(!tr.length){alert('Marcá al menos un servicio.');return}
  if(!$('#tf').value){alert('Elegí el día.');return}
  D.servicios.push({id:uid(),cid:$('#tc').value,estado:'turno',fecha:$('#tf').value,hora:$('#th').value,trabajos:tr});
  save();render();
}
function waTurno(id){
  const s=D.servicios.find(x=>x.id===id),c=cli(s.cid);
  wa(c.tel,`Hola ${c.nombre}, te recordamos tu turno en el taller el ${fd(s.fecha)} a las ${s.hora||''} para: ${s.trabajos.join(', ')}. ¡Te esperamos!`);
}
function borrar(id){
  if(!confirm('¿Borrar este turno?'))return;
  D.servicios=D.servicios.filter(s=>s.id!==id);save();render();
}

/* ---------- Trabajo hecho + resumen al cliente ---------- */
function elig(s){return s.trabajos.filter(t=>t in D.interv)}
function hecho(id){
  cur=id;
  const ik=elig(D.servicios.find(x=>x.id===id)).map((t,i)=>`<label>${e(corto(t))}: próximo cambio dentro de (km). Poné 0 si no lleva aviso<input id="ik${i}" type="number" inputmode="numeric" value="${D.interv[t]||0}"></label>`).join('');
  $('#dlg').innerHTML=`<h2>Trabajo hecho</h2>
  <label>Kilometraje actual del auto<input id="hk" type="number" inputmode="numeric" placeholder="Ej: 85000"></label>
  <label>Aceite usado (tipo y litros)<input id="ha" placeholder="Ej: 10W40 sintético, 4 L"></label>
  <label>Costo total $<input id="hc" type="number" inputmode="numeric"></label>
  <h2>Cada cuántos km se vuelve a cambiar</h2>
  <p class="vacio">Ajustalo según el motor de este auto (la correa de distribución puede ir de 60.000 a 160.000 km).</p>${ik}
  <p class="vacio">Al guardar se abre WhatsApp con el resumen para el cliente y los km del próximo cambio.</p>
  <div class="row"><button onclick="guardarHecho()">Guardar y avisar al cliente</button><button class="sec" onclick="$('#dlg').close()">Cancelar</button></div>`;
  $('#dlg').showModal();
}
function guardarHecho(){
  const km=parseInt($('#hk').value);
  if(!km){alert('Poné el kilometraje actual.');return}
  const s=D.servicios.find(x=>x.id===cur),prox={};
  elig(s).forEach((t,i)=>{const v=parseInt($('#ik'+i).value)||0;if(v)prox[t]=km+v});
  Object.assign(s,{estado:'hecho',fechaHecho:hoy(),km,aceite:$('#ha').value,costo:$('#hc').value,prox,avisados:{}});
  save();$('#dlg').close();
  wa(cli(s.cid).tel,msgHecho(s));
  render();
}
function msgHecho(s){
  const c=cli(s.cid);
  const lis=s.trabajos.map(t=>'✔ '+t+(s.prox&&s.prox[t]?' (próximo: a los '+nk(s.prox[t])+' km)':'')).join('\n');
  return `Hola ${c.nombre}, te escribimos del taller. En tu ${c.auto} (${c.patente}), a los ${nk(s.km)} km, se hizo:\n${lis}\nCuando se acerque el próximo cambio te vamos a avisar. ¡Gracias por confiar en nosotros!`;
}
function reenv(id){const s=D.servicios.find(x=>x.id===id);wa(cli(s.cid).tel,msgHecho(s))}

/* ---------- Avisos de próximo cambio ---------- */
function estKm(s,c){
  const dias=Math.max(0,(new Date(hoy())-new Date(s.fechaHecho))/864e5);
  return (Number(s.km)||0)+Math.round(dias/30*(c.kmMes||1000));
}
function avisosPend(){
  const g=[];
  D.servicios.filter(s=>s.estado==='hecho'&&s.prox).forEach(s=>{
    const c=cli(s.cid),est=estKm(s,c),it=[];
    Object.keys(s.prox).forEach(t=>{
      if((s.avisados||{})[t])return;
      if(D.servicios.some(x=>x.cid===s.cid&&x.estado==='hecho'&&x.fechaHecho>s.fechaHecho&&x.trabajos.includes(t)))return;
      const falta=s.prox[t]-est;
      if(falta<=D.margen)it.push({t,falta,km:s.prox[t]});
    });
    if(it.length)g.push({s,c,it,est});
  });
  return g.sort((a,b)=>Math.min(...a.it.map(i=>i.falta))-Math.min(...b.it.map(i=>i.falta)));
}
function txtFalta(i){return i.falta>0?'faltan aprox. '+nk(i.falta)+' km':'ya te toca el cambio'}
function vAvisos(){
  const l=avisosPend();
  return '<h2>Clientes para avisar</h2><p class="vacio">Se calcula con los km del último servicio y los km por mes de cada cliente.</p>'+(l.length?l.map(g=>`<div class="card"><b>${e(g.c.nombre)}</b> · ${e(g.c.auto)} ${e(g.c.patente)}
    <p>Último servicio: ${fd(g.s.fechaHecho)} a los ${nk(g.s.km)} km<br>Km estimado hoy: ${nk(g.est)}</p>
    ${g.it.map(i=>`<p>• ${e(corto(i.t))}: ${txtFalta(i)} (se cambia a los ${nk(i.km)} km)</p>`).join('')}
    <div class="row"><button class="sec" onclick="waAviso('${g.s.id}')">Avisar por WhatsApp</button><button class="del" onclick="yaAviso('${g.s.id}')">Ya avisé</button></div></div>`).join(''):'<p class="vacio">Nadie para avisar por ahora.</p>');
}
function marcar(g){g.it.forEach(i=>{g.s.avisados=g.s.avisados||{};g.s.avisados[i.t]=true})}
function waAviso(id){
  const g=avisosPend().find(x=>x.s.id===id);if(!g)return;
  const m=`Hola ${g.c.nombre}, te escribimos del taller. Para tu ${g.c.auto} (${g.c.patente}), según el último servicio a los ${nk(g.s.km)} km:\n`+g.it.map(i=>'- '+corto(i.t)+': '+txtFalta(i)+' (se cambia a los '+nk(i.km)+' km)').join('\n')+'\n¿Querés que te saquemos un turno?';
  wa(g.c.tel,m);marcar(g);save();render();
}
function yaAviso(id){const g=avisosPend().find(x=>x.s.id===id);if(!g)return;marcar(g);save();render()}

/* ---------- Clientes ---------- */
function vClientes(){
  const l=D.clientes.map(c=>{
    const h=D.servicios.filter(s=>s.cid===c.id&&s.estado==='hecho').sort((a,b)=>b.fechaHecho.localeCompare(a.fechaHecho));
    return `<details class="card"><summary>${e(c.nombre)} · ${e(c.patente)}</summary>
    <p>${e(c.auto)}<br>Tel: ${e(c.tel)}<br>Hace unos ${nk(c.kmMes||1000)} km por mes</p>
    ${h.length?h.map(s=>`<p>• ${fd(s.fechaHecho)} · ${nk(s.km||0)} km<br>${e(s.trabajos.join(', '))}${s.aceite?' · '+e(s.aceite):''}${s.costo?' · $'+e(s.costo):''}<br><button class="sec" onclick="reenv('${s.id}')">Reenviar resumen</button></p>`).join(''):'<p class="vacio">Sin servicios hechos todavía.</p>'}
    <button class="del" onclick="delCli('${c.id}')">Borrar cliente</button></details>`}).join('');
  const ints=TRAB.map((t,i)=>`<label>${t} (km)<input type="number" inputmode="numeric" value="${D.interv[t]}" onchange="setInt(${i},this.value)"></label>`).join('');
  return `<h2>Nuevo cliente</h2><div class="card">
  <label>Nombre<input id="cn"></label>
  <label>WhatsApp (con código de área, sin 0 ni 15)<input id="ct" inputmode="tel" placeholder="Ej: 2255123456"></label>
  <label>Auto (marca y modelo)<input id="ca"></label>
  <label>Patente<input id="cp" autocapitalize="characters"></label>
  <label>Km que hace por mes (aprox.)<input id="ck" type="number" inputmode="numeric" value="1000"></label>
  <button onclick="addCli()">Guardar cliente</button></div>
  <h2>Clientes (${D.clientes.length})</h2>${l||'<p class="vacio">Todavía no cargaste clientes.</p>'}
  <h2>Cada cuántos km se cambia</h2><details class="card"><summary>Ver y cambiar los km de cada servicio</summary>
  <p class="vacio">Poné 0 si ese servicio no lleva aviso.</p>${ints}
  <label>Avisar al cliente cuando falten (km)<input type="number" inputmode="numeric" value="${D.margen}" onchange="setMargen(this.value)"></label></details>
  <h2>Copia de seguridad</h2><div class="card"><p>Los datos quedan guardados solo en este aparato. Hacé una copia seguido.</p>
  <div class="row"><button onclick="copiar()">Copiar copia</button><button class="sec" onclick="restaurar()">Restaurar copia</button></div></div>`;
}
function setInt(i,v){D.interv[TRAB[i]]=parseInt(v)||0;save()}
function setMargen(v){D.margen=parseInt(v)||1000;save()}
function addCli(){
  const n=$('#cn').value.trim();
  if(!n){alert('Poné el nombre del cliente.');return}
  D.clientes.push({id:uid(),nombre:n,tel:$('#ct').value.trim(),auto:$('#ca').value.trim(),patente:$('#cp').value.trim().toUpperCase(),kmMes:parseInt($('#ck').value)||1000});
  save();render();
}
function delCli(id){
  if(!confirm('¿Borrar este cliente y todo su historial?'))return;
  D.clientes=D.clientes.filter(c=>c.id!==id);
  D.servicios=D.servicios.filter(s=>s.cid!==id);
  save();render();
}
function copiar(){
  const t=JSON.stringify(D);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Copia lista. Pegala en un chat de WhatsApp para guardarla.'),()=>prompt('Copiá este texto:',t));
  else prompt('Copiá este texto:',t);
}
function restaurar(){
  const t=prompt('Pegá la copia de seguridad:');
  if(!t)return;
  try{
    const x=JSON.parse(t);
    if(!Array.isArray(x.clientes)||!Array.isArray(x.servicios))throw 0;
    if(!confirm('Esto reemplaza los datos de este aparato. ¿Seguir?'))return;
    D=x;fix();save();render();
  }catch(err){alert('Ese texto no es una copia válida.')}
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
