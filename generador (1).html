<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de códigos</title>
<style>
body{margin:0;background:#10191E;color:#E8EEF0;font:16px/1.4 system-ui,Arial,sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;border-bottom:4px solid #E8A317;padding-bottom:8px}
h2{font-size:17px;margin-top:22px}
label{display:block;margin:10px 0;font-size:14px;color:#9DB4C0}
input,select{width:100%;padding:10px;margin-top:4px;font-size:16px;border:1px solid #33474F;border-radius:8px;background:#1B2A32;color:#E8EEF0}
button{background:#E8A317;color:#14232B;border:0;border-radius:8px;padding:11px 14px;font-size:15px;font-weight:700;margin:6px 6px 0 0}
button.s{background:#2E7D4F;color:#fff}
.card{background:#1B2A32;border:1px solid #33474F;border-radius:10px;padding:12px;margin:10px 0}
.cod{font-size:24px;font-weight:700;letter-spacing:1px;word-break:break-all}
.m{color:#9DB4C0;font-size:14px}
</style></head><body>
<h1>Generador de códigos</h1>
<p class="m">Es solo para vos. No lo subas a GitHub ni lo compartas.</p>
<label>Tipo de código<select id="t" onchange="mostrar()"><option value="P">Prueba (vence solo)</option><option value="F">Definitivo (no vence)</option></select></label>
<label id="dl">Días de prueba<input id="d" type="number" inputmode="numeric" value="7"></label>
<label>Para quién es (taller o mecánico)<input id="n" placeholder="Ej: Taller de Juan"></label>
<button onclick="gen()">Generar código</button>
<div id="out"></div>
<h2>Códigos generados en este aparato</h2><div id="hist"></div>
<script>

const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const SECRETO='tp-5f803795744ba5c7';
const BASE=Date.UTC(2026,0,1);
function h53(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function enc(n,l){let s='';for(let i=0;i<l;i++){s=AB[n%32]+s;n=Math.floor(n/32)}return s}
function dec(s){let n=0;for(const c of s){const i=AB.indexOf(c);if(i<0)return -1;n=n*32+i}return n}
function chk(t,id,ex){return enc(h53(SECRETO+t+id+ex)%1048576,4)}
function diasDe(f){const p=f.split('-').map(Number);return Math.round((Date.UTC(p[0],p[1]-1,p[2])-BASE)/864e5)}
function fechaDe(n){return new Date(BASE+n*864e5).toISOString().slice(0,10)}
function crear(tipo,id,diasVence){const ex=tipo==='P'?enc(diasVence,3):'AAA';const c=tipo+id+ex+chk(tipo,id,ex);return c.slice(0,1)+'-'+c.slice(1,4)+'-'+c.slice(4,7)+'-'+c.slice(7)}
function leer(code,hoyStr,revocados){
  const c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const mal={ok:false,msg:'El código no es válido. Revisalo y probá de nuevo.'};
  if(c.length!==11)return mal;
  const t=c[0],id=c.slice(1,4),ex=c.slice(4,7);
  if((t!=='P'&&t!=='F')||chk(t,id,ex)!==c.slice(7))return mal;
  if((revocados||[]).includes(id))return{ok:false,msg:'Este código fue dado de baja. Pedí uno nuevo.'};
  if(t==='F')return{ok:true,tipo:'F',id:id};
  const v=dec(ex),h=diasDe(hoyStr);
  if(v<0)return mal;
  if(h>v)return{ok:false,msg:'La prueba terminó el '+fechaDe(v).split('-').reverse().join('/')+'. Pedí tu código definitivo.'};
  return{ok:true,tipo:'P',id:id,quedan:v-h+1,vence:fechaDe(v)};
}

const LINK='https://pablofelipecastro2022-feli.github.io/Taller/';
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=f=>f.split('-').reverse().join('/');
let H=[];try{H=JSON.parse(localStorage.getItem('tallerGen'))||[]}catch(x){}
function mostrar(){$('#dl').style.display=$('#t').value==='P'?'block':'none'}
function idAzar(){const a=new Uint8Array(3);crypto.getRandomValues(a);return [...a].map(x=>AB[x%32]).join('')}
function gen(){
  const t=$('#t').value,n=$('#n').value.trim()||'(sin nombre)';
  let dias=parseInt($('#d').value)||7,vence='';
  if(dias<1)dias=1;
  let ex=0;
  if(t==='P'){ex=diasDe(hoy())+dias-1;vence=fechaDe(ex)}
  const id=idAzar(),code=crear(t,id,ex);
  H.unshift({code:code,n:n,t:t,v:vence,f:hoy(),id:id});
  try{localStorage.setItem('tallerGen',JSON.stringify(H))}catch(x){}
  const msg='Hola, te paso la app del taller: '+LINK+'\n\nTu código de activación: '+code+(t==='P'?'\n(Prueba gratis hasta el '+fd(vence)+')':'')+'\n\n1) Abrí el link en Chrome.\n2) Ingresá el código.\n3) En el menú de Chrome tocá "Instalar app".';
  window._msg=msg;window._code=code;
  $('#out').innerHTML='<div class="card"><div class="cod">'+e(code)+'</div><p class="m">'+(t==='P'?'Prueba hasta el '+fd(vence):'Definitivo, no vence')+' · ID para dar de baja: <b>'+id+'</b></p><button class="s" onclick="wsp()">Enviar por WhatsApp</button><button onclick="cop()">Copiar mensaje</button></div>';
  lista();
}
function wsp(){window.open('https://wa.me/?text='+encodeURIComponent(window._msg),'_blank')}
function cop(){if(navigator.clipboard)navigator.clipboard.writeText(window._msg).then(()=>alert('Mensaje copiado.'));else prompt('Copiá:',window._msg)}
function lista(){
  $('#hist').innerHTML=H.length?H.map(h=>'<div class="card"><b>'+e(h.n)+'</b><br><span class="cod" style="font-size:18px">'+e(h.code)+'</span><p class="m">'+(h.t==='P'?'Prueba hasta '+fd(h.v):'Definitivo')+' · creado '+fd(h.f)+' · ID '+e(h.id)+'</p></div>').join(''):'<p class="m">Todavía no generaste ninguno.</p>';
}
mostrar();lista();
</script></body></html>
